<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Devodoro</title>
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>
<link rel="stylesheet" href="../../css/dashboard.css">
<script src="../../js/authGuard.js"></script>
</head>

<body>

<div class="sidebar">
  <div>
    <div class="logo">DEVODORO</div>

    <div class="nav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="equipe.html">Equipe</a>
      <a href="configuracoes.html">Configurações</a>
    </div>
  </div>

  <div class="user">
    <div class="avatar sidebarAvatar"></div>

    <div>
      <strong class="sidebarNome"></strong>
      <p>Empresa</p>
    </div>

    <form class="logout-form" method="POST" action="../../php/logout.php">
      <button class="logout-btn" type="submit">Sair</button>
    </form>
  </div>
</div>

<div class="main" id="app">
  <div class="header">
    <div class="title">Dashboard</div>
  </div>

  <div class="cards">
    <div class="card" id="total"><p>Total</p><h2>0</h2></div>
    <div class="card" id="concluidas"><p>Concluídas</p><h2>0</h2></div>
    <div class="card" id="emprogresso"><p>Em progresso</p><h2>0</h2></div>
    <div class="card" id="atrasados"><p>Atrasadas</p><h2>0</h2></div>

    <div class="pomodoro">
      <h3 id="mode">FOCO</h3>

      <div id="timer">25:00</div>

      <div class="buttons">
        <button onclick="startTimer()">Iniciar</button>
        <button onclick="pauseTimer()">Pausar</button>
        <button onclick="resetTimer()">Resetar</button>
      </div>

      <p>Ciclos: <span id="cycles">0</span></p>
    </div>
  </div>

  <div class="task-list">
    <div class="tf">Tarefas Recentes</div>
    <div id="recentTasks"></div>
  </div>
</div>

<script src="../../js/apiClient.js"></script>
<script src="../../js/loadProfile.js"></script>
<script src="../../js/dashboard.js"></script>
</body>
</html>

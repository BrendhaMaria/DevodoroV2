<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Devodoro</title>
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/dashboard.css">

</head>

<body>

<div class="sidebar">
  <div>
    <div class="logo">DEVODORO</div>

    <div class="nav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="equipe.html">Equipe</a>
      <a href="configuracoes.html">Configurações</a>
    </div>
  </div>

  <div class="user">
    <div class="avatar">B</div>
    <div>
      <strong>brendha</strong>
      <p>Empresa</p>
    </div>
  </div>
</div>

<div class="main" id="app">
  <div class="header">
      <div class="title">Dashboard</div>
      <div class="actions">
        <input class="search" placeholder="Buscar tarefas...">
        <button class="btn" onclick="tarefas()">+ Nova Tarefa</button>
      </div>
    </div>

    <div class="cards">
      <div class="card" id="total"><p>Total</p><h2></h2></div>
      <div class="card" id="concluidas"><p>Concluídas</p><h2></h2></div>
      <div class="card" id="emprogresso"><p>Em progresso</p><h2></h2></div>
      <div class="card" id="atrasados"><p>Atrasadas</p><h2>0</h2></div>
      
    </div>
  
    <div class="task-list">
    <div class="tf">Tarefas Recentes</div>
        <div class="task">
          <span class="badge ${t.status}"></span>
        </div>
    </div>
</div>

</body>
</html>

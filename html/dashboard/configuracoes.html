<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Document</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
    <script src="../../js/authGuard.js"></script>
</head>
<body>
<div class="sidebar">
  <div>
    <div class="logo">DEVODORO</div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="equipe.html">Equipe</a>
      <a href="configuracoes.html" class="active">Configurações</a>
    </div>
  </div>

    <div class="user">

      <div class="avatar sidebarAvatar"></div>

      <div>
        <strong class="sidebarNome"></strong>
        <p>Empresa</p>
      </div>

      <form class="logout-form" method="POST" action="../../php/logout.php">
        <button class="logout-btn" type="submit">Sair</button>
      </form>

    </div>

</div>

<div class="main" id="app">
    <div class="header">
      <div class="title" id="conf">Configurações</div>
    </div>

    <div class="card">
    <h2>Aparência</h2>
    <div class="modoescuro">
      <span>Modo escuro/Claro</span> <br><br>
      <button id="escuro">Alternar</button>
      <br><br>

<div class="settings">

  <h2>Conta e Perfil</h2>

  <div class="setting-group">

    <div class="setting-item">
      <label>Nome</label>
      <input type="text" id="nameInput" placeholder="Seu nome">
    </div>

    <div class="setting-item">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="seu@email.com">
    </div>

    <div class="setting-item">

      <label>Avatar</label>

      <img
        id="previewAvatar"
        src="../../uploads/perfis/default.png"
        width="100"
        height="100"
        style="
          border-radius:50%;
          object-fit:cover;
          display:block;
          margin-bottom:10px;
        "
      >

      <input
        type="file"
        id="avatarInput"
        accept=".png,.jpg,.jpeg"
      >

    </div>

<br>

<button class="btn" id="saveProfile">
  Salvar
</button>

  </div>

<div class="card" style="margin-top:20px;">
  <h2>Código da Empresa</h2>

  <p>
    Este código é usado pelos funcionários para se cadastrarem na sua empresa.
  </p>

  <div style="display:flex; gap:10px; align-items:center;">

    <input 
      type="password"
      id="codigoEmpresa"
      readonly
      style="flex:1;"
    >

    <button 
      class="btn"
      id="mostrarCodigoBtn"
      onclick="mostrarCodigo()"
    >
      Mostrar Código
    </button>

    <button class="btn" onclick="copiarCodigo()">
      Copiar
    </button>

  </div>
</div>

</div>    

<script>

async function carregarEmpresa() {
    try {
        const res = await fetch("../../api/empresa-info.php");
        const data = await res.json();

        if (data.error) {
            console.log(data.error);
            return;
        }

        document.getElementById("codigoEmpresa").value =
            data.codigo_acesso;

        document.getElementById("nameInput").value =
            data.nome;

        document.getElementById("emailInput").value =
            data.email;

    } catch (err) {
        console.log("Erro ao carregar empresa", err);
    }
}

function mostrarCodigo() {
    const input = document.getElementById("codigoEmpresa");
    const btn = document.getElementById("mostrarCodigoBtn");

    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Ocultar Código";

    } else {
        input.type = "password";
        btn.textContent = "Mostrar Código";
    }
}

function copiarCodigo() {
    const input = document.getElementById("codigoEmpresa");

    input.select();
    input.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(input.value);

    alert("Código copiado");
}

carregarEmpresa();
</script>

<script>

/* =========================
   CARREGA PERFIL
========================= */

async function carregarPerfil() {

    try {

        const res =
            await fetch("../../api/perfilApi.php");

        const data = await res.json();

        if (data.error) {
            console.log(data.error);
            return;
        }

        document.getElementById("nameInput").value =
            data.nome || "";

        document.getElementById("emailInput").value =
            data.email || "";

        const avatar =
            document.getElementById("previewAvatar");

        avatar.src = data.foto_perfil
            ? "../../" + data.foto_perfil
            : "../../uploads/perfis/default.png";

    } catch (err) {

        console.log(err);
    }
}

/* =========================
   PREVIEW IMAGEM
========================= */

document
.getElementById("avatarInput")
.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        document.getElementById(
            "previewAvatar"
        ).src = event.target.result;
    };

    reader.readAsDataURL(file);
});

/* =========================
   SALVAR PERFIL
========================= */

document
.getElementById("saveProfile")
.addEventListener("click", async () => {

    const nome =
        document.getElementById("nameInput").value;

    const foto =
        document.getElementById("avatarInput").files[0];

    const formData = new FormData();

    formData.append("nome", nome);

    if (foto) {
        formData.append("foto", foto);
    }

    try {

        const res = await fetch(
            "../../api/perfilApi.php",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await res.json();

        if (data.error) {

            alert(data.error);
            return;
        }

        alert(data.message);

        carregarPerfil();

    } catch (err) {

        console.log(err);

        alert("Erro ao salvar perfil");
    }
});

/* =========================
   INIT
========================= */

carregarPerfil();

</script>

<script src="../../js/loadProfile.js"></script>
<script src="../../js/modoescuro.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="sidebar">
  <div>
    <div class="logo">DEVODORO</div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="equipe.html">Equipe</a>
      <a href="configuracoes.html" class="active">Configurações</a>
    </div>
  </div>

  <div class="user">
    <div class="avatar">B</div>
    <div>
      <strong>brendha</strong>
      <p>Empresa</p>
    </div>
  </div>
</div>

<div class="main" id="app">
    <div class="header">
      <div class="title" id="conf">Configurações</div>
    </div>

    <div class="card">
    <h2>Aparência</h2>
    <div class="modoescuro">
      <span>Modo escuro/Claro</span> <br><br>
      <button id="escuro">Alternar</button>
      <br><br>
<div class="settings">

  <h2>Conta e Perfil</h2>

  <div class="setting-group">

    <div class="setting-item">
      <label>Nome</label>
      <input type="text" id="nameInput" placeholder="Seu nome">
    </div>

    <div class="setting-item">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="seu@email.com">
    </div>

    <div class="setting-item">
      <label>Avatar</label>
      <input type="file" id="avatarInput">
    </div>
    <br>
    <button class="btn" id="saveProfile">Salvar</button>
  </div>

<div class="card" style="margin-top:20px;">
  <h2>Código da Empresa</h2>

  <p>
    Este código é usado pelos funcionários para se cadastrarem na sua empresa.
  </p>

  <div style="display:flex; gap:10px; align-items:center;">

    <input 
      type="password"
      id="codigoEmpresa"
      readonly
      style="flex:1;"
    >

    <button 
      class="btn"
      id="mostrarCodigoBtn"
      onclick="mostrarCodigo()"
    >
      Mostrar Código
    </button>

    <button class="btn" onclick="copiarCodigo()">
      Copiar
    </button>

  </div>
</div>

</div>    

<script>

async function carregarEmpresa() {
    try {
        const res = await fetch("../../api/empresa-info.php");
        const data = await res.json();

        if (data.error) {
            console.log(data.error);
            return;
        }

        document.getElementById("codigoEmpresa").value =
            data.codigo_acesso;

        document.getElementById("nameInput").value =
            data.nome;

        document.getElementById("emailInput").value =
            data.email;

    } catch (err) {
        console.log("Erro ao carregar empresa", err);
    }
}

function mostrarCodigo() {
    const input = document.getElementById("codigoEmpresa");
    const btn = document.getElementById("mostrarCodigoBtn");

    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Ocultar Código";

    } else {
        input.type = "password";
        btn.textContent = "Mostrar Código";
    }
}

function copiarCodigo() {
    const input = document.getElementById("codigoEmpresa");

    input.select();
    input.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(input.value);

    alert("Código copiado");
}

carregarEmpresa();
</script>

<script src="../../js/modoescuro.js"></script>
</body>
</html>

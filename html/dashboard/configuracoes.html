<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Configuracoes</title>

  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>

  <link rel="stylesheet" href="../../css/dashboard.css">
  <script src="../../js/authGuard.js"></script>

</head>
<body>

  <div class="sidebar">

    <div>
      <div class="logo">DEVODORO</div>

      <div class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="tarefas.html">Tarefas</a>
        <a href="equipe.html">Equipe</a>
        <a href="configuracoes.html" class="active">Configuracoes</a>
      </div>
    </div>

    <div class="user">
      <div class="avatar sidebarAvatar"></div>

      <div>
        <strong class="sidebarNome"></strong>
        <p>Empresa</p>
      </div>

      <form class="logout-form" method="POST" action="../../php/logout.php">
        <button class="logout-btn" type="submit">Sair</button>
      </form>
    </div>

  </div>

  <div class="main" id="app">
    <div class="header">
      <div class="title" id="conf">Configuracoes</div>
    </div>

    <!--Alterações de Brendha-->
    <div class="card">

      <h2>Aparência</h2>
      <div class="modoescuro">
        <span>Modo escuro/Claro</span> <br><br>
        <button id="escuro">Alternar</button>
        <br><br>
      </div>
    
      <div class="settings">

        <h2>Conta e Perfil</h2>

        <div class="setting-group">
          
          <div class="avatar-section">

            <img
              id="previewAvatar"
              class="avatar-preview"
              src="../../uploads/perfis/default.png"
              width="100"
              height="100"
              alt="Avatar do perfil"
              title="Avatar do perfil"
            >

            <!-- Botão -->
            <label for="avatarInput" class="upload-btn">
              Upload de imagem
            </label>

            <input 
              type="file" 
              id="avatarInput" 
              accept=".png,.jpg,.jpeg"
              hidden
            >
          
          </div>

          <div class="setting-item">

            <label for="avatarInput">Avatar</label>
            <label for="nameInput">Nome</label>

            <input
              type="text"
              id="nameInput"
              placeholder="Digite seu nome"
              title="Nome do usuário">

          </div>

          <div class="setting-item">

            <label for="emailInput">Email</label>

            <input
              type="email"
              id="emailInput"
              placeholder="Digite seu email"
              title="Endereço de email">

          </div>

        </div>

        <br>

        <button class="btn" id="saveProfile">
          Salvar
        </button>

      </div>

      <div class="card card--spaced" id="empresaCodigoCard">
        <h2>Código da Empresa</h2>

        <p>
          Este código é usado pelos funcionários para se cadastrarem na sua empresa.
        </p>

        <div class="input-row">

          <input 
            type="password"
            id="codigoEmpresa"
            readonly
            class="flex-fill"
            placeholder="Código da empresa"
            title="Código da empresa"
          >

          <button
            class="btn"
            id="mostrarCodigoBtn"
            type="button">
            Mostrar Código
          </button>

          <button
            class="btn"
            id="copiarCodigoBtn"
            type="button">
            Copiar
          </button>

        </div>
      </div>

    </div>

  </div>

  <script src="../../js/apiClient.js"></script>
  <script src="../../js/loadProfile.js"></script>
  <script src="../../js/modoescuro.js"></script>
  <script src="../../js/configuracoes.js"></script>

</body>
</html>

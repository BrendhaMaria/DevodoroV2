<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Configuracoes</title>
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
  <link rel="stylesheet" href="../../css/dashboard.css">
  <script src="../../js/authGuard.js"></script>
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="logo">DEVODORO</div>

      <div class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="tarefas.html">Tarefas</a>
        <a href="equipe.html">Equipe</a>
        <a href="configuracoes.html" class="active">Configuracoes</a>
      </div>
    </div>

    <div class="user">
      <div class="avatar sidebarAvatar"></div>

      <div>
        <strong class="sidebarNome"></strong>
        <p>Empresa</p>
      </div>

      <form class="logout-form" method="POST" action="../../php/logout.php">
        <button class="logout-btn" type="submit">Sair</button>
      </form>
    </div>
  </div>

  <div class="main" id="app">
    <div class="header">
      <div class="title" id="conf">Configuracoes</div>
    </div>

    <div class="card">
      <h2>Aparencia</h2>
      <div class="modoescuro">
        <span>Modo escuro/claro</span>
        <br><br>
        <button id="escuro" type="button">Alternar</button>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <h2>Conta e Perfil</h2>

      <div class="settings">
        <div class="setting-group">
          <div class="setting-item">
            <label for="nameInput">Nome</label>
            <input type="text" id="nameInput" placeholder="Seu nome" autocomplete="name">
          </div>

          <div class="setting-item">
            <label for="emailInput">Email</label>
            <input type="email" id="emailInput" placeholder="seu@email.com" autocomplete="email">
          </div>

          <div class="setting-item">
            <label for="avatarInput">Avatar</label>

            <img
              id="previewAvatar"
              src="../../uploads/perfis/default.png"
              width="100"
              height="100"
              alt="Avatar atual"
              style="border-radius:50%; object-fit:cover; display:block; margin-bottom:10px;"
            >

            <input type="file" id="avatarInput" accept=".png,.jpg,.jpeg,image/png,image/jpeg">
          </div>

          <br>

          <button class="btn" id="saveProfile" type="button">
            Salvar
          </button>
        </div>
      </div>
    </div>

    <div class="card" id="empresaCodigoCard" style="margin-top:20px;">
      <h2>Codigo da Empresa</h2>

      <p>
        Este codigo e usado pelos funcionarios para se cadastrarem na sua empresa.
      </p>

      <div style="display:flex; gap:10px; align-items:center;">
        <input
          type="password"
          id="codigoEmpresa"
          readonly
          style="flex:1;"
        >

        <button class="btn" id="mostrarCodigoBtn" type="button">
          Mostrar Codigo
        </button>

        <button class="btn" id="copiarCodigoBtn" type="button">
          Copiar
        </button>
      </div>
    </div>
  </div>

  <script src="../../js/apiClient.js"></script>
  <script src="../../js/loadProfile.js"></script>
  <script src="../../js/modoescuro.js"></script>
  <script src="../../js/configuracoes.js"></script>
</body>
</html>

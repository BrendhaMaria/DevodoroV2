<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>
    <link rel="stylesheet" href="../../css/dashboard.css">
    
</head>
<body>

<div class="sidebar">
  <div>
    <div class="logo">DEVODORO</div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="equipe.html" class="active">Equipe</a>
      <a href="configuracoes.html">Configurações</a>
    </div>
  </div>

  <div class="user">
    <div class="avatar">B</div>
    <div>
      <strong>brendha</strong>
      <p>Empresa</p>
    </div>
  </div>
</div>

<div class="main" id="app">

    <div class="header">
      <div class="title">Equipes</div>
      <button class="btn" onclick="createTeam()">Criar equipe</button>
    </div>

    <div id="teamList"></div>
    <hr>

    <div id="teamDetails">
      <h3>Equipe selecionada</h3>

      <div id="members"></div>

      <h4>Adicionar funcionário</h4>
      <div id="availableEmployees"></div>
    </div>
</div>

<script>
let selectedTeam = null;

async function loadTeams() {
    const res = await fetch("../../api/equipeApi.php");
    const data = await res.json();

    document.getElementById("teamList").innerHTML =
        data.map(t => `
            <div class="card" onclick="selectTeam(${t.id})">
                ${t.nome}
            </div>
        `).join("");
}

async function selectTeam(id) {
    selectedTeam = id;

    loadTeamMembers();
    loadAvailableEmployees();
}

async function loadTeamMembers() {
    const res = await fetch(`../../api/equipeFuncionarioApi.php?id_equipe=${selectedTeam}`);
    const data = await res.json();

    document.getElementById("members").innerHTML =
        data.map(f => `
            <div class="card">
                ${f.nome}
                <button onclick="removeFromTeam(${f.id_funcionario})">Remover</button>
            </div>
        `).join("");
}

async function loadAvailableEmployees() {
    const res = await fetch(`../../api/funcionariosDisponiveis.php?id_equipe=${selectedTeam}`);
    const data = await res.json();

    document.getElementById("availableEmployees").innerHTML =
        data.map(f => `
            <div class="card">
                ${f.nome}
                <button onclick="addToTeam(${f.id_funcionario})">Adicionar</button>
            </div>
        `).join("");
}

async function createTeam() {

    const nome = prompt("Nome da equipe:");

    if (!nome) return;

    await fetch("../../api/equipeApi.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ nome })
    });

    loadTeams();
}

async function addToTeam(idFuncionario) {
    await fetch("../../api/equipeFuncionarioApi.php", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            id_equipe: selectedTeam,
            id_funcionario: idFuncionario
        })
    });

    loadTeamMembers();
}

loadTeams();
</script>

</body>
</html>

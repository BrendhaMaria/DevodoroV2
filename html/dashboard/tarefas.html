<div class="main" id="app">

    <button class="btn" onclick="openModal()">+ Nova Tarefa</button>
  </div>

<!-- LISTA -->
<div class="task-list" id="taskList"></div>

<!-- ========================= -->
<!-- MODAL NOVA TAREFA -->
<!-- ========================= -->
<div class="modal" id="taskModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2 id="taskModalTitle">Nova Tarefa</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">

      <label>Título</label>
      <input type="text" id="taskInput" placeholder="Digite o título">

      <label>Prioridade</label>
      <select id="prioridade">
        <option value="BAIXA">Baixa</option>
        <option value="MEDIA">Média</option>
        <option value="ALTA">Alta</option>
      </select>

      <label>Estado</label>
      <select id="estado">
        <option value="PENDENTE">Pendente</option>
        <option value="EM_ANDAMENTO">Em andamento</option>
        <option value="CONCLUIDA">Concluída</option>
      </select>

      <label>Prazo de entrega</label>
      <input type="date" id="prazo">

      <label>Equipes vinculadas</label>
      <select id="equipesTarefa" multiple></select>

      <label>FuncionÃ¡rios vinculados</label>
      <select id="funcionariosTarefa" multiple></select>

    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" id="taskModalSave" onclick="saveTask()">Criar tarefa</button>
    </div>

  </div>
</div>

<script src="../../js/loadProfile.js"></script>
<script src="../../js/tarefas.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
    <script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>
</head>
<body>
  <div class="sidebar">
  <div>
    <div class="logo">DEVODORO</div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="tarefas.html" class="active">Tarefas</a>
      <a href="equipe.html">Equipe</a>
      <a href="configuracoes.html">Configurações</a>
    </div>
  </div>

  <div class="user">
    <div class="avatar">B</div>
    <div>
      <strong>brendha</strong>
      <p>Empresa</p>
    </div>
  </div>
</div>

<div class="main" id="app">
    <div class="header">
  <div class="title">Tarefas</div>

  <div class="actions">
    <input class="search" placeholder="Buscar tarefas...">
    <button class="btn" onclick="openModal()">+ Nova Tarefa</button>
  </div>
</div>

<!-- LISTA -->
<div class="task-list" id="taskList"></div>

<!-- ========================= -->
<!-- MODAL NOVA TAREFA -->
<!-- ========================= -->
<div class="modal" id="taskModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>Nova Tarefa</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">

      <label>Título</label>
      <input type="text" id="taskInput" placeholder="Digite o título">

      <label>Prioridade</label>
      <select id="prioridade">
        <option value="BAIXA">Baixa</option>
        <option value="MEDIA">Média</option>
        <option value="ALTA">Alta</option>
      </select>

      <label>Status</label>
      <select id="status">
        <option value="PENDENTE">Pendente</option>
        <option value="EM_PROGRESSO">Em progresso</option>
        <option value="CONCLUIDA">Concluída</option>
      </select>

      <label>Prazo de entrega</label>
      <input type="date" id="prazo">

    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="addTask()">Criar tarefa</button>
    </div>

  </div>
</div>
<div class="task-list" id="taskList"></div>

<script src="../../js/tarefas.js"></script>
</body>
</html>

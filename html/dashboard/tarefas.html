<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
    <script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>
</head>
<body>
  <div class="sidebar">
  <div>
    <div class="logo">DEVODORO</div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="tarefas.html" class="active">Tarefas</a>
      <a href="equipe.html">Equipe</a>
      <a href="configuracoes.html">Configurações</a>
    </div>
  </div>

  <div class="user">
    <div class="avatar">B</div>
    <div>
      <strong>brendha</strong>
      <p>Empresa</p>
    </div>
  </div>
</div>

<div class="main" id="app">
    <div class="header">
      <div class="title">Tarefas</div>
      <button class="btn" onclick="addTask()">+ Nova</button>
    </div>

    <input id="taskInput" placeholder="Nome da tarefa" type="text">

    <select  id="prioridade">
      <option value="BAIXA">Baixa</option>
      <option value="MEDIA">Média</option>
      <option value="ALTA">Alta</option>
    </select>
    
    <select id="estado">
      <option value="PENDENTE">Pendente</option>
      <option value="EM_ANDAMENTO">Em andamento</option>
      <option value="CONCLUIDA">Concluída</option>
    </select>

<div class="task-list" id="taskList"></div>
</div>

<script src="../../js/tarefas.js"></script>
</body>
</html>

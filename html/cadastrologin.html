<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devodoro - Login</title>
<link rel="stylesheet" href="../css/cadlogin.css">

</head>
<body>

<div class="overlay">
  <div class="container">

    <h2>Acesso</h2>

    <!-- ROLE SWITCH -->
    <div class="role-switch" id="roleSwitch">
      <div class="role-indicator"></div>
      <button id="empresaBtn" class="active">Empresa</button>
      <button id="funcionarioBtn">Funcionário</button>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Cadastro</button>
    </div>

    <!-- LOGIN -->
<form id="loginForm" method="POST" action="../php/login.php">
  <input type="email" name="email" placeholder="Email" required>
  <input type="password" name="senha" placeholder="Senha" required>
  <input type="hidden" name="tipo" id="loginTipo">

  <button class="submit">Entrar</button>
  <div class="switch">Não tem conta? <span id="goRegister">Criar</span></div>
</form>

    <!-- REGISTER -->
    <form id="registerForm" method="POST" action="../php/cadastro.php" class="hidden">
      <input type="text" name="nome" placeholder="Nome" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="senha" placeholder="Senha" required>
      <input type="text" name="codigo_empresa" id="codigoEmpresa" placeholder="Código da empresa" style="display:none;">

      <input type="hidden" name="tipo" id="registerTipo">

      <button class="submit">Cadastrar</button>
      <div class="switch">Já tem conta? <span id="goLogin">Entrar</span></div>
    </form>

  </div>
</div>

<script>
const loginTab = document.getElementById('loginTab');
const registerTab = document.getElementById('registerTab');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const codigoInput = document.getElementById("codigoEmpresa");

const empresaBtn = document.getElementById('empresaBtn');
const funcionarioBtn = document.getElementById('funcionarioBtn');
const roleSwitch = document.getElementById('roleSwitch');

let role = "empresa";

loginTab.onclick = () => {
  loginForm.classList.remove('hidden');
  registerForm.classList.add('hidden');
  loginTab.classList.add('active');
  registerTab.classList.remove('active');
}

registerTab.onclick = () => {
  loginForm.classList.add('hidden');
  registerForm.classList.remove('hidden');
  registerTab.classList.add('active');
  loginTab.classList.remove('active');
}

empresaBtn.onclick = () => {
  role = "empresa";
  roleSwitch.classList.remove('funcionario');
  empresaBtn.classList.add('active');
  funcionarioBtn.classList.remove('active');

  codigoInput.style.display = "none";
}


funcionarioBtn.onclick = () => {
  role = "funcionario";
  roleSwitch.classList.add('funcionario');
  funcionarioBtn.classList.add('active');
  empresaBtn.classList.remove('active');

  codigoInput.style.display = "block";
}

document.getElementById('goRegister').onclick = () => registerTab.click();
document.getElementById('goLogin').onclick = () => loginTab.click();

loginForm.onsubmit = ()=>{
  document.getElementById("loginTipo").value = role;
}

registerForm.onsubmit = ()=>{
  document.getElementById("registerTipo").value = role;

  if (role === "funcionario" && !codigoInput.value) {
    alert("Informe o código da empresa");
    return false;
  }
}

</script>

</body>
</html>
